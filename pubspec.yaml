name: fml
description: "Flutter Minecraft Launcher"
publish_to: 'none'
version: 1.9.0+12

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.0.3
  path: ^1.9.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  system_info2: ^4.0.0
  file_picker: ^10.3.10
  dio: ^5.9.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1
  archive: ^4.0.7
  package_info_plus: ^9.0.0
  flutter_markdown_plus: ^1.0.7
  html: ^0.15.5
  uuid: ^4.5.1
  flutter_gbk2utf8: ^1.0.1
  encrypt: ^5.0.3
  device_info_plus: ^12.3.0
  share_plus: ^12.0.1
  desktop_drop: ^0.8.4
  dart_nbt: ^0.1.2
  window_manager: ^0.5.1
  intl: ^0.20.2
  lazy_load_indexed_stack: ^1.2.1
  win32_registry: ^2.1.0
  open_filex: ^4.7.0
  material_ui: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/icon/
    - assets/img/logo/flutter.png
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-VF.ttf
